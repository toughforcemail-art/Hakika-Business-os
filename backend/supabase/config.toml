project_id = "upvupkuokinwqwsfxyxy"

[db]
major_version = 17

[api]
enabled = true
schemas = ["public", "graphql_public", "platform", "iam", "billing", "audit", "real_estate", "integrations", "communications", "finance", "hr"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://hakika-business-os-frontend.vercel.app/"
additional_redirect_urls = ["https://hakika-business-os-frontend.vercel.app/", "http://localhost:3000"]
jwt_expiry = 43200
password_requirements = "lower_upper_letters_digits_symbols"

[mfa]
max_enrolled_factors = 10

[mfa.totp]
enroll_enabled = true
verify_enabled = true

[mfa.phone]
enroll_enabled = true
verify_enabled = true

[email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
# Keep email confirmation links aligned with the 48-hour Hakika invitation
# token. The invitation RPC remains the final authorization check.
otp_expiry = 172800

[sms]
enable_signup = true
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[sms.twilio]
enabled = true

[functions.send-sms]
verify_jwt = false

[functions.app-mfa]
verify_jwt = true

[functions.send-invitation]
verify_jwt = true
